name: DART data update
on:
  workflow_dispatch:
  schedule:
    # UTC 16:15 = KST 01:15 the next calendar day.
    # Daily check is deliberate: it catches newly published reports and only commits changed data.
    - cron: "15 16 * * *"
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: dart-data-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Fetch DART financial data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python src/update_data.py
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update DART financial data"
            git push
          else
            echo "No changes to commit"
          fi
